name: KEIBA predictions (suspended pending verified JRA source)
# WARNING: Archived data is not source-authenticated. Weekend automation is suspended.
# Restore the schedule only after an audited JRA-VAN/JV-Link importer and
# independent pre-race snapshot verification have passed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  refuse-unverified-source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Reject historical archive lacking official source evidence
        run: python -m src.data_trust_gate
      - name: Build predictions ONLY if source verification passed
        run: |
          python -m pip install -r requirements.txt
          python scripts/build_race_cache.py
      - name: Send notifications ONLY after verified predictions
        run: python scripts/auto_notify_s_rank.py
