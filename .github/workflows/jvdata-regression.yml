name: JV-Data fixed-width regression
on:
  push:
    branches: [feature/prerace-odds-prediction-recorder]
  pull_request:
    paths:
      - "src/jvlink_adapter.py"
      - "src/jvlink_worker.py"
      - "src/jvlink_client.py"
      - "tests/test_jvdata_spec_regression.py"
      - "tests/test_jvlink_transport_contract.py"
      - "tests/test_jvlink_interpreter_selection.py"
      - "scripts/probe_jvlink_com.py"
      - "INSTALL_AUTO_MONITOR.bat"
      - "REPAIR_PIP.bat"
      - "scripts/run_scheduled_task.bat"
      - "tests/test_jvlink_feed_orchestration.py"
      - "tests/test_live_jvlink_dashboard.py"
      - "tests/test_odds_notification_safety.py"
      - "tests/test_live_buy_signal_end_to_end.py"
      - "tests/test_scheduled_live_scan_contract.py"
      - "tests/test_release_acceptance.py"
      - "tests/test_bundled_dashboard_model.py"
      - "src/model.py"
      - "models/keiba_lgbm.joblib.sha256"
      - "scripts/check_release_readiness.py"
      - "CHECK_RELEASE.bat"
      - "scripts/run_background_scan.py"
      - "src/automated_monitor.py"
      - "scripts/check_jvlink_readiness.py"
      - "scripts/build_live_jvlink_dashboard.py"
      - "app.py"
      - ".github/workflows/jvdata-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jvdata-spec-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile JV-Link modules and regression tests
        run: python -m compileall -q src/jvlink_adapter.py src/jvlink_worker.py src/jvlink_client.py tests/test_jvdata_spec_regression.py tests/test_jvlink_transport_contract.py tests/test_jvlink_feed_orchestration.py tests/test_jvlink_interpreter_selection.py
      - name: Run pure-Python official-layout regression tests
        run: |
          python -m unittest discover -s tests -p test_jvdata_spec_regression.py -v
          python -m unittest discover -s tests -p test_jvlink_transport_contract.py -v
          python -m unittest discover -s tests -p test_jvlink_interpreter_selection.py -v
          python -m unittest discover -s tests -p test_jvlink_feed_orchestration.py -v

  live-dashboard-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install live inference prerequisites
        run: python -m pip install "numpy>=1.24" "pandas>=2" "scikit-learn>=1.3" "lightgbm>=4" "joblib>=1.3" "requests>=2.31"
      - name: Compile app and live dashboard
        run: python -m compileall -q app.py src/automated_monitor.py scripts/check_jvlink_readiness.py scripts/build_live_jvlink_dashboard.py tests/test_live_jvlink_dashboard.py tests/test_odds_notification_safety.py tests/test_scheduled_live_scan_contract.py tests/test_live_buy_signal_end_to_end.py tests/test_release_acceptance.py scripts/check_release_readiness.py
      - name: Test signed read-only live odds and prediction display
        run: |
          python -m unittest discover -s tests -p test_live_jvlink_dashboard.py -v
          python -m unittest discover -s tests -p test_odds_notification_safety.py -v
          python -m unittest discover -s tests -p test_bundled_dashboard_model.py -v
          python -m unittest discover -s tests -p test_release_acceptance.py -v
          python -m unittest discover -s tests -p test_bundled_dashboard_model.py -v
          python -m unittest discover -s tests -p test_live_buy_signal_end_to_end.py -v
          python -m unittest discover -s tests -p test_scheduled_live_scan_contract.py -v
          python -m unittest discover -s tests -p test_release_acceptance.py -v

  windows-offline-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies (no JRA SDK required)
        run: python -m pip install -r requirements.txt
      - name: Validate Streamlit app and Windows launcher syntax assumptions
        run: |
          python -m compileall -q app.py src/jvlink_worker.py src/jvlink_client.py scripts/run_background_scan.py scripts/run_background_monitor.py scripts/build_live_jvlink_dashboard.py
          python -m unittest discover -s tests -p test_scheduled_live_scan_contract.py -v
      - name: Run offline worker, odds and user-interface smoke tests
        run: |
          python -m unittest discover -s tests -p test_jvlink_transport_contract.py -v
          python -m unittest discover -s tests -p test_jvlink_interpreter_selection.py -v
          python -m unittest discover -s tests -p test_jvlink_feed_orchestration.py -v
          python -m unittest discover -s tests -p test_live_jvlink_dashboard.py -v
          python -m unittest discover -s tests -p test_odds_notification_safety.py -v

      - name: Package Windows personal beta
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "dist/KEIBA_AI_Windows_Beta"
          New-Item -ItemType Directory -Path "$dest/data" -Force | Out-Null
          $paths = @("src", "scripts", "models", "app.py", "requirements.txt", "INSTALL_AUTO_MONITOR.bat", "REPAIR_PIP.bat", "CHECK_RELEASE.bat", "START_KEIBA_AI.bat", "GO_LIVE_CHECKLIST.md", "AUTO_MONITOR_README.md")
          foreach ($path in $paths) { Copy-Item -Recurse -Force $path $dest }
          Copy-Item "data/keiba.db" "$dest/data/keiba.db" -Force
          Compress-Archive -Path $dest -DestinationPath "dist/KEIBA_AI_Windows_Beta.zip" -Force
      - name: Upload personal beta package
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: KEIBA_AI_Windows_Beta
          path: dist/KEIBA_AI_Windows_Beta.zip
          retention-days: 30
