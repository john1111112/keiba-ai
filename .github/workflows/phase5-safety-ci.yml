name: Phase 5 Safety Tests
on:
  push:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - 'pages/**'
      - '.github/workflows/phase5-safety-ci.yml'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install lightweight dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy
      - name: Run Phase 5 isolated unit and safety tests
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          python -m unittest discover -s scripts -p 'test_feature_provenance.py' -v
          python -m unittest discover -s scripts -p 'test_paper_*.py' -v
          python -m unittest scripts.test_verified_settlement scripts.test_pre_race_odds_import -v
