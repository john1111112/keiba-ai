name: Historical winner audit (no odds)
on:
  pull_request:
    paths:
      - 'scripts/blind_winner_audit.py'
      - '.github/workflows/blind_winner_audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-2025:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout historical race DB and code
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install only audit dependencies
        run: python -m pip install "numpy>=1.24,<3" "pandas>=2,<3" "lightgbm>=4,<5" "scikit-learn>=1.3,<2"
      - name: 2025 chronological no-odds winner test
        run: python -m scripts.blind_winner_audit
      - name: Preserve evidence (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 2025-historical-winner-audit
          path: blind_audit_output/
          if-no-files-found: warn
          retention-days: 30
