name: Race-wide provenance quarantine audit
on:
  pull_request:
    paths:
      - 'src/scraper.py'
      - 'scripts/full_dataset_provenance_audit.py'
      - 'scripts/test_full_data_integrity.py'
      - '.github/workflows/full_dataset_integrity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  forensic:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify code compiles
        run: python -m py_compile src/scraper.py scripts/full_dataset_provenance_audit.py scripts/test_full_data_integrity.py
      - name: Install source-parser dependencies
        run: python -m pip install "pandas>=2,<3" "requests>=2,<3" "beautifulsoup4>=4.12,<5" "lxml>=5,<7"
      - name: Prove synthetic generator is disabled
        run: python -m unittest scripts.test_full_data_integrity -v
      - name: Read-only SQLite forensic audit
        run: python -m scripts.full_dataset_provenance_audit
      - name: Preserve race-by-race evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: race-by-race-provenance-audit
          path: dataset_provenance_audit/
          if-no-files-found: warn
          retention-days: 30
