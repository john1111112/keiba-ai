name: Offline odds drop tests

on:
  pull_request:
    paths:
      - "scripts/detect_odds_drops.py"
      - "scripts/import_manual_odds.py"
      - "scripts/import_prerace_csv.py"
      - "scripts/audit_prerace_history.py"
      - "scripts/import_odds_folder.py"
      - "tests/test_odds_folder.py"
      - "tests/test_history_audit.py"
      - "tests/test_prerace_csv.py"
      - "scripts/prerace_readiness.py"
      - "src/odds_provider.py"
      - "tests/test_odds_provider_failclosed.py"
      - "src/odds_history.py"
      - "src/prerace_recorder.py"
      - "scripts/run_prerace_auto_recorder.py"
      - "tests/test_schedule_scan_safety.py"
      - "tests/test_recorder_provenance.py"
      - "tests/test_inference_leakage.py"
      - "scripts/render_prerace_dashboard.py"
      - "tests/test_prerace_dashboard.py"
      - "scripts/run_manual_prerace_pipeline.py"
      - "tests/test_manual_pipeline.py"
      - "tests/test_odds_batch_atomic.py"
      - "src/odds_history.py"
      - "tests/test_odds_asof.py"
      - "tests/test_odds_drops.py"
      - "tests/test_manual_odds.py"
      - "tests/test_prerace_readiness.py"
      - ".github/workflows/odds-drop-tests.yml"
  push:
    branches:
      - "feature/prerace-odds-prediction-recorder"
    paths:
      - "scripts/detect_odds_drops.py"
      - "scripts/import_manual_odds.py"
      - "tests/test_odds_drops.py"
      - "tests/test_manual_odds.py"
      - ".github/workflows/odds-drop-tests.yml"

permissions:
  contents: read

jobs:
  offline-odds-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install importer dependencies
        run: python -m pip install pandas numpy requests beautifulsoup4 lightgbm pyarrow scikit-learn
      - name: Run complete offline safety suite
        run: |
          set +e
          failed=0
          python -m unittest discover -s tests -p 'test_odds_drops.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_manual_odds.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_prerace_csv.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_history_audit.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_odds_folder.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_prerace_readiness.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_odds_asof.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_recorder_provenance.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_odds_batch_atomic.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_manual_pipeline.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_prerace_dashboard.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_inference_leakage.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_odds_provider_failclosed.py' -v || failed=1
          python -m unittest discover -s tests -p 'test_schedule_scan_safety.py' -v || failed=1
          exit "$failed"
