name: Offline odds drop tests

on:
  pull_request:
    paths:
      - "scripts/detect_odds_drops.py"
      - "scripts/import_manual_odds.py"
      - "scripts/prerace_readiness.py"
      - "src/odds_provider.py"
      - "tests/test_odds_provider_failclosed.py"
      - "src/odds_history.py"
      - "src/prerace_recorder.py"
      - "scripts/run_prerace_auto_recorder.py"
      - "tests/test_schedule_scan_safety.py"
      - "tests/test_recorder_provenance.py"
      - "tests/test_inference_leakage.py"
      - "scripts/render_prerace_dashboard.py"
      - "tests/test_prerace_dashboard.py"
      - "tests/test_odds_asof.py"
      - "tests/test_odds_drops.py"
      - "tests/test_manual_odds.py"
      - "tests/test_prerace_readiness.py"
      - ".github/workflows/odds-drop-tests.yml"
  push:
    branches:
      - "feature/prerace-odds-prediction-recorder"
    paths:
      - "scripts/detect_odds_drops.py"
      - "scripts/import_manual_odds.py"
      - "tests/test_odds_drops.py"
      - "tests/test_manual_odds.py"
      - ".github/workflows/odds-drop-tests.yml"

permissions:
  contents: read

jobs:
  offline-odds-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install importer dependencies
        run: python -m pip install pandas numpy requests beautifulsoup4 lightgbm pyarrow scikit-learn
      - name: Run odds-drop tests
        run: python -m unittest discover -s tests -p 'test_odds_drops.py' -v
      - name: Run manual-import tests
        run: python -m unittest discover -s tests -p 'test_manual_odds.py' -v
      - name: Run readiness tests
        run: python -m unittest discover -s tests -p 'test_prerace_readiness.py' -v
      - name: Run as-of provenance tests
        run: python -m unittest discover -s tests -p 'test_odds_asof.py' -v
      - name: Run recorder provenance tests
        run: python -m unittest discover -s tests -p 'test_recorder_provenance.py' -v
      - name: Run dashboard tests
        run: python -m unittest discover -s tests -p 'test_prerace_dashboard.py' -v
      - name: Run inference leakage tests
        run: python -m unittest discover -s tests -p 'test_inference_leakage.py' -v
      - name: Run provider fail-closed tests
        run: python -m unittest discover -s tests -p 'test_odds_provider_failclosed.py' -v
      - name: Run schedule scan safety tests
        run: python -m unittest discover -s tests -p 'test_schedule_scan_safety.py' -v
