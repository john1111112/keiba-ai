name: Extended as-of historical feature ablation
on:
  pull_request:
    paths:
      - 'src/asof_form_features.py'
      - 'scripts/ablation_2026_asof.py'
      - '.github/workflows/asof_feature_ablation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research requirements
        run: python -m pip install "numpy>=1.24,<3" "pandas>=2,<3" "lightgbm>=4,<5" "scikit-learn>=1.3,<2"
      - name: Train baseline and extended only on past years, evaluate 2026
        run: python -m scripts.ablation_2026_asof
      - name: Preserve measurements, including failed runs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: feature-ablation-2026
          path: feature_ablation_output/
          if-no-files-found: warn
          retention-days: 30
