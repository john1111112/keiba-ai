name: JV-Link Offline Unit Tests
on:
  workflow_dispatch:
jobs:
  offline-tests:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline JV-Link tests without SDK or trial
        shell: pwsh
        run: |
          python -m unittest discover -s tests -p "test_jvlink*.py" -v
          python -m unittest discover -s tests -p "test_run_jvlink_collection.py" -v
          python -m unittest discover -s tests -p "test_jvlink_capture_status.py" -v
          python -m unittest discover -s tests -p "test_audit_jvlink_raw.py" -v
      - name: Compile SDK boundary
        shell: pwsh
        run: |
          python -m py_compile src/jvlink_raw_store.py src/jvlink_ingest.py src/jvlink_capture_status.py scripts/capture_jvlink.py scripts/run_jvlink_collection.py scripts/audit_jvlink_raw.py
