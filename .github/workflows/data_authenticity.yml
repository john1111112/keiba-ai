name: Race-history data authenticity audit
on:
  pull_request:
    paths:
      - 'scripts/fetch_bulk_real_jra.py'
      - 'scripts/populate_full_weekend.py'
      - 'scripts/audit_training_data_truth.py'
      - 'scripts/test_importer_authenticity.py'
      - '.github/workflows/data_authenticity.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit-importers-and-committed-db:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Static compile new and existing importers
        run: python -m py_compile scripts/fetch_bulk_real_jra.py scripts/populate_full_weekend.py scripts/audit_training_data_truth.py scripts/test_importer_authenticity.py
      - name: Install parsing dependencies for no-network regression tests
        run: python -m pip install "requests>=2.31,<3" "beautifulsoup4>=4.12,<5" "numpy>=1.24,<3" "pandas>=2,<3"
      - name: Verify absent values are not made up
        run: python -m unittest scripts.test_importer_authenticity -v
      - name: Audit existing SQLite data in read-only mode
        run: python -m scripts.audit_training_data_truth
      - name: Save actual database counts for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: historical-db-authenticity-audit
          path: data_authenticity_output/
          if-no-files-found: warn
          retention-days: 30
